<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Котиковый адвент</title>
<meta name="theme-color" content="#0c1630">
<meta property="og:title" content="Котиковый адвент">
<meta property="og:description" content="31 окошко до Нового года. Каждый день новое.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: нежный, праздничный, домашний — подарок одному человеку
   IDEA: настоящий картонный адвент-календарь с дверцами, висящий в зимнюю ночь
   PICTURE: сетка дверц разного размера под гирляндой и падающим снегом, №31 — большая коробка с лентой
   COLOUR and TYPE: ночной синий фон, бархатный красный, ёлочный зелёный, крафт, золото; Marck Script для цифр и пожеланий + Nunito
   LAYOUT: гирлянда → заголовок с таймером → сетка 6 колонок (4 на телефоне) → модалка с картинкой дня */
:root{color-scheme:dark;--night:#0c1630;--ink:#f6f1e7;--muted:#b9c3dd;--gold:#f0cf7a;--gold2:#b98a2e;--red:#a3223a;--green:#1c5944;--blue:#284780;--kraft:#b88c55}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% -10%,#2b4378 0%,var(--night) 55%,#060c1b 100%) fixed;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#fx{z-index:30}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 max(4vw,14px) 40px}
/* гирлянда */
.garland{position:relative;height:56px;margin:0 -2vw}
.garland svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:11px;height:17px;border-radius:50% 50% 45% 45%;transform:translate(-50%,0);animation:tw 2.4s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:2px;top:-5px;width:7px;height:6px;border-radius:2px;background:#4a4f5c}
@keyframes tw{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.45;filter:brightness(.7)}}
/* шапка */
header{text-align:center;padding:18px 0 26px;position:relative}
.moon{position:absolute;right:2%;top:-8px;width:clamp(54px,9vw,96px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffbe8,#f1e3b4 60%,#d8c48c);box-shadow:0 0 60px 18px rgba(255,240,190,.18);cursor:pointer;transition:transform .4s}
.moon:hover{transform:scale(1.06)}
h1{font:400 clamp(44px,8vw,80px)/1 "Marck Script",cursive;margin:0;color:#fff;text-shadow:0 0 24px rgba(240,207,122,.45);text-wrap:balance}
.sub{color:var(--muted);margin:10px auto 18px;max-width:34em}
.timer{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(240,207,122,.3);font-weight:600}
.timer b{font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
/* сетка дверц */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(96px,13vw,138px);gap:12px;grid-auto-flow:dense;padding:14px;border-radius:22px;background:rgba(6,12,28,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 30px 60px rgba(0,0,0,.35)}
.w2{grid-column:span 2}.h2{grid-row:span 2}
.door{position:relative;perspective:900px;border:0;padding:0;background:none;cursor:pointer;border-radius:12px;color:inherit;font:inherit}
.door:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.behind{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#fdf6ea,#e7eefb);box-shadow:inset 0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center}
.behind svg{width:78%;height:78%}
.behind small{position:absolute;left:8px;bottom:5px;font:400 18px/1 "Marck Script",cursive;color:#6b4b3a}
.leaf{position:absolute;inset:0;border-radius:12px;transform-origin:left center;transition:transform 1s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -10px 20px rgba(0,0,0,.18)}
.leaf::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1px dashed rgba(255,255,255,.22)}
.num{font:400 clamp(30px,4.4vw,50px)/1 "Marck Script",cursive;background:linear-gradient(170deg,#fff3c4,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));position:relative;z-index:1}
.h2 .num,.w2 .num{font-size:clamp(38px,5.6vw,64px)}
.t0{background:radial-gradient(circle at 30% 20%,#c9364f,#8b1a2d)}
.t1{background:radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 2.2px) 0 0/15px 15px,linear-gradient(#22684f,#174a39)}
.t2{background:repeating-linear-gradient(45deg,#284780 0 10px,#2f5394 10px 20px)}
.t3{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px),linear-gradient(#c49a62,#a77a44)}
.t4{background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 7px,transparent 7px 21px),repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 7px,transparent 7px 21px),#8b1a2d}
.big .leaf{background:radial-gradient(circle at 50% 40%,#c9364f,#7c1527)}
.big .leaf::before{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,transparent calc(50% - 9px),var(--gold) calc(50% - 9px) calc(50% + 9px),transparent calc(50% + 9px)),linear-gradient(0deg,transparent calc(50% - 9px),var(--gold) calc(50% - 9px) calc(50% + 9px),transparent calc(50% + 9px));opacity:.9}
.big .num{width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#8b1a2d,#5e0f1e);-webkit-background-clip:border-box;background-clip:border-box;color:var(--gold);box-shadow:0 0 0 4px var(--gold)}
.door.open .leaf{pointer-events:none;transform:rotateY(-100deg);opacity:0;transition:transform 1s cubic-bezier(.3,1.3,.5,1),opacity .45s .6s}
.door.today:not(.open) .leaf{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 18px 4px rgba(240,207,122,.55)}50%{box-shadow:0 0 0 2px var(--gold),0 0 32px 10px rgba(240,207,122,.25)}}
.door.locked .leaf{filter:saturate(.75) brightness(.85)}
.door.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}}
/* тост */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:#fdf6ea;color:#3b2a22;padding:12px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:40;transition:transform .35s;max-width:calc(100vw - 32px);text-align:center;font-weight:600}
.toast.show{transform:translate(-50%,0);visibility:visible}
/* модалка */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(4,8,20,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fdf6ea;color:#3b2a22;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.9) translateY(20px);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.modal.on .card{transform:none}
.pic{aspect-ratio:1;background:linear-gradient(165deg,#dfe9fb,#fbeee0);display:grid;place-items:center;position:relative;border-radius:22px 22px 0 0;overflow:hidden}
.pic svg{width:62%;height:62%}
.pic .ph{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:13px;color:#7b6a60;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:999px;white-space:nowrap}
.meta{padding:18px 24px 8px;text-align:center}
.date{font-size:14px;font-weight:800;color:var(--red);letter-spacing:.02em}
.meta h2{font-size:21px;line-height:1.25;margin:4px 0 10px}
.wish{font:400 clamp(26px,5vw,32px)/1.2 "Marck Script",cursive;color:#7c1527;min-height:2.4em;margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 16px}
.btn{min-width:44px;min-height:44px;border-radius:999px;border:0;background:#efe3cf;color:#3b2a22;font:600 15px Nunito,sans-serif;padding:0 16px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.x{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.85);font-size:22px;padding:0}
/* панель макета */
.banner{margin:0 auto 16px;max-width:760px;padding:10px 16px;border-radius:14px;border:1px dashed rgba(240,207,122,.45);color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.banner select{font:600 16px Nunito,sans-serif;min-height:44px;border-radius:10px;padding:0 10px;background:#13234a;color:var(--ink);border:1px solid rgba(255,255,255,.2)}
.behind img{width:100%;height:100%;object-fit:cover}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pic.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%) 0 0/250% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.door.wait .leaf{filter:saturate(.5) brightness(.7)}
.retry{margin-left:6px}
footer{text-align:center;color:var(--muted);font:400 22px "Marck Script",cursive;margin-top:26px}
.snd{position:fixed;top:12px;left:12px;z-index:35;width:44px;height:44px;border-radius:50%;border:1px solid rgba(240,207,122,.45);background:rgba(12,22,48,.7);color:var(--gold);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.snd:focus-visible,.tune:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.snd[aria-pressed=false]{color:var(--muted);border-color:rgba(255,255,255,.2)}
.tune{display:inline-block;margin:10px auto 0;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#8a6d5c;font:600 14px Nunito,sans-serif;cursor:pointer}
.tune:hover{background:#f3e8d6}
@media(max-width:600px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:86px;gap:8px;padding:8px}
 .num{font-size:30px}.h2 .num,.w2 .num{font-size:40px}
 .garland{height:44px}
 .moon{width:40px;top:-38px;right:4px}
 .dh{grid-row:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" class="layer"></canvas>
<canvas id="fx" class="layer"></canvas>
<button class="snd" id="snd" aria-pressed="true"></button>
<div class="wrap">
  <div class="garland" id="garland"></div>
  <header>
    <div class="moon" id="moon" title="Луна"></div>
    <h1>Котиковый адвент</h1>
    <p class="sub">31 окошко, по одному на каждый день декабря. Каждое утро открывается новое, а заглянуть в будущее не получится.</p>
    <div class="timer" id="timer"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="grid" id="grid" aria-label="Окошки календаря"></main>

  <footer>С любовью, твоя лисичка</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <button class="btn x" id="close" aria-label="Закрыть">×</button>
    <div class="pic" id="mPic"></div>
    <div class="meta">
      <div class="date" id="mDate"></div>
      <h2 id="mTitle"></h2>
      <p class="wish" id="mWish"></p>
      <button class="tune" id="tune"></button>
    </div>
    <div class="nav">
      <button class="btn" id="prev">← Вчера</button>
      <button class="btn" id="next">Завтра →</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const DAYS=[
["Распаковывает коробку с ёлочными игрушками","Пусть этот декабрь будет самым тёплым"],
["Пьёт какао с маршмеллоу","Чтобы каждое утро начиналось со сладкого"],
["Пишет письмо Деду Морозу","Загадывай смело, всё сбудется"],
["Вешает гирлянду на окно","Пусть дома всегда горит свет, который ждёт тебя"],
["Лепит снеговика","Сил и спокойствия на всю зиму"],
["Катается на коньках","Пусть всё получается легко, как скольжение по льду"],
["Печёт имбирное печенье","Немного пряностей в каждый день"],
["Вяжет шарф","Тебе самое уютное тепло"],
["Играет в снежки","Приглашаю на снежную битву! Проигравший варит глинтвейн"],
["Спит под пледом","Выспаться тоже новогоднее желание"],
["Мчится на санках с горки","Только вверх. Ну и немножко вниз, для веселья"],
["Чистит мандарины","Пусть всё вокруг пахнет праздником"],
["Смотрит новогодний фильм","Сегодня вечер кино, попкорн с меня"],
["Делает снежного ангела","Ты мой ангел-хранитель"],
["Выбирает ёлку на базаре","Самую пушистую тебе"],
["Распутывает гирлянду","Любой клубок распутывается, если вместе"],
["Катается на лыжах","Пусть дорога будет ровной"],
["Ловит снежинки языком","Радоваться мелочам — главная суперсила"],
["Наряжает ёлку","Дом там, где мы вместе"],
["Заворачивает подарки","Самый лучший подарок — это ты"],
["Смотрит на звёзды в самую длинную ночь","Дальше дни будут только светлее"],
["Греет лапы у камина","Тепла тебе внутри и снаружи"],
["Подписывает открытки друзьям","Пусть рядом всегда будут свои люди"],
["Варит глинтвейн","За тебя!"],
["Строит снежную крепость","Ты моя крепость"],
["Гуляет по городу в огнях","Приглашаю на вечернюю прогулку"],
["Режет оливье","Готовимся к главному ужину года"],
["Надевает свитер с оленями","Сегодня день смешных свитеров"],
["Загадывает желание на падающую звезду","Загадай, а я помогу ему сбыться"],
["Зажигает бенгальские огни","Ещё чуть-чуть!"],
["Поднимает бокал под бой курантов","С Новым годом, мой любимый котик! Твоя лисичка"]];
const ORDER=[12,1,27,8,19,31,18,4,22,15,10,16,23,25,24,17,21,7,14,2,30,9,26,13,11,20,5,28,6,29,3];
const SIZE={31:"w2 h2 big",1:"w2",13:"w2",24:"w2",9:"w2",7:"h2",18:"h2 dh",25:"h2",20:"h2 dh"};
const BG=["#fbe9e4","#e4f1ea","#e4ebfa","#f6ecdc","#efe6f6"];
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const cat=(scarf="#b8283f",hat=false)=>`<svg viewBox="0 0 120 120" aria-hidden="true">
<ellipse cx="60" cy="110" rx="34" ry="5" fill="rgba(60,40,30,.15)"/>
<path d="M84 100c20-2 24-26 10-30" stroke="#d9c4a8" stroke-width="9" fill="none" stroke-linecap="round"/>
<ellipse cx="60" cy="88" rx="28" ry="23" fill="#e4d2b8"/>
<path d="M39 42 36 18l19 14zM81 42l3-24-19 14z" fill="#e4d2b8"/>
<path d="M42 36 41 25l8 7zM78 36l1-11-8 7z" fill="#f2b8b0"/>
<circle cx="60" cy="54" r="25" fill="#e9d8bf"/>
<path d="M48 53q4-4 8 0M64 53q4-4 8 0" stroke="#3b2a22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M57.5 59h5l-2.5 3z" fill="#d98a86"/>
<path d="M60 62q-3 4-6 2M60 62q3 4 6 2" stroke="#3b2a22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<circle cx="45" cy="62" r="4" fill="#f2b8b0" opacity=".7"/><circle cx="75" cy="62" r="4" fill="#f2b8b0" opacity=".7"/>
<path d="M37 74q23 11 46 0v8q-23 11-46 0z" fill="${scarf}"/><rect x="66" y="80" width="9" height="18" rx="3" fill="${scarf}"/>
${hat?`<path d="M36 38q24-30 48 0z" fill="#b8283f"/><rect x="34" y="34" width="52" height="8" rx="4" fill="#fff"/><circle cx="88" cy="22" r="5" fill="#fff"/><path d="M60 14q18 0 26 8" stroke="#b8283f" stroke-width="7" fill="none"/>`:""}
</svg>`;
const scarfOf=d=>["#b8283f","#1f6a50","#2b4f90","#c0892f"][d%4];

/* ===== НАСТРОЙКА: вставьте сюда ссылку на веб-приложение Apps Script (заканчивается на /exec) ===== */
const API="https://script.google.com/macros/s/AKfycbwpzCSoNvhp2UOmeiEzPL3f_DhLerb464uMzXt2aaW7h2R0VPvuO8a12ZodE_cyapOH/exec";
/* ================================================================================================ */
const DEMO=!/^https:\/\/script\.google/.test(API);
const qs=new URLSearchParams(location.search);
const TESTMODE=qs.has("test")||qs.has("key");
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let KEY=qs.get("key")||(TESTMODE?ls.get("advent-key")||"":"");
let ASOF=qs.has("asof")?qs.get("asof"):(TESTMODE?ls.get("advent-asof")||"":"");
const LS=TESTMODE?"advent-2026-test-opened":"advent-2026-opened";

let opened=new Set();
try{opened=new Set(JSON.parse(ls.get(LS)||"[]"))}catch(e){}
const save=()=>ls.set(LS,JSON.stringify([...opened]));
/* в основном режиме открытые окошки запоминаются на сервере, чтобы были одинаковыми на всех устройствах */
const sync=d=>{if(!DEMO&&!TESTMODE)api({open:d}).catch(()=>{})};
function markOpen(d){if(opened.has(d))return false;opened.add(d);save();sync(d);return true}

let today=-1,nextIn=0,info={},full={},preview=false;

function almaty(){
  const p={};for(const x of new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Almaty",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()))p[x.type]=+x.value;
  return p;
}
function api(extra){
  const u=new URLSearchParams(extra);if(TESTMODE&&KEY)u.set("key",KEY);if(TESTMODE&&ASOF)u.set("asof",ASOF);
  return fetch(API+"?"+u).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j});
}
function demoData(){
  const n=almaty();let t=(n.year>2026)?31:(n.year<2026||n.month<12)?0:n.day;
  if(ASOF)t=Math.max(0,Math.min(31,+ASOF||0));else if(TESTMODE)t=31;
  return{today:t,preview:TESTMODE,nextIn:86400-(n.hour*3600+n.minute*60+n.second),
    days:DAYS.slice(0,t).map(([title,wish],i)=>({day:i+1,title,wish,thumb:""}))};
}
async function load(){
  if(TESTMODE&&!DEMO&&!KEY){askKey("");return}
  const slow=setTimeout(()=>{if(today<0)$("timer").textContent="Скрипт просыпается, ещё чуть-чуть…"},5000);
  try{
    const d=DEMO?demoData():await api({});
    clearTimeout(slow);
    if(TESTMODE&&!DEMO&&!d.preview){ls.del("advent-key");KEY="";askKey("Ключ не подошёл, попробуйте ещё раз.");return}
    if(TESTMODE&&KEY)ls.set("advent-key",KEY);
    today=d.today;nextIn=d.nextIn;preview=d.preview;info={};
    for(const x of d.days)info[x.day]=x;
    if(!DEMO&&!TESTMODE&&Array.isArray(d.opened)){
      const server=new Set(d.opened);
      for(const x of opened)if(!server.has(x)&&x<=today)sync(x);
      opened=new Set([...server,...opened].filter(x=>x<=today));save();
    }
    banner();render();loadThumbs();
  }catch(e){
    clearTimeout(slow);
    $("timer").innerHTML=`Не получилось достучаться до календаря <button class="btn retry" id="retry">Ещё раз</button>`;
    $("retry").onclick=load;
  }
}
function askKey(msg){
  const b=$("banner");b.hidden=false;
  $("timer").textContent="Тестовый адвент";
  b.innerHTML=`<form id="kf" style="display:contents">${msg?msg+" ":""}Введите ключ предпросмотра: <input id="kin" type="password" autocomplete="current-password" aria-label="Ключ предпросмотра" style="font:16px Nunito,sans-serif;min-height:44px;border-radius:10px;padding:0 12px;border:1px solid rgba(255,255,255,.25);background:#13234a;color:var(--ink);width:12em"> <button class="btn" type="submit" style="background:var(--gold);color:#3b2a22">Войти</button></form>`;
  $("kf").onsubmit=e=>{e.preventDefault();KEY=$("kin").value.trim();if(KEY){$("timer").textContent="Проверяем ключ…";$("kf").querySelector("button").disabled=true;load()}};
  $("kin").focus();
}
function banner(){
  const b=$("banner");
  if(!TESTMODE&&!DEMO){b.hidden=true;return}
  const opts=["<option value=''>открыты все 31 день</option>"].concat(Array.from({length:32},(_,i)=>`<option value="${i}" ${ASOF===String(i)?"selected":""}>как будто сегодня ${i?i+" декабря":"ещё ноябрь"}</option>`)).join("");
  b.hidden=false;
  b.innerHTML=`<b style="color:var(--gold)">Тестовый адвент.</b> Открывайте окошки сколько угодно, у котика ничего не изменится.
    <select id="asof" aria-label="Дата для проверки">${opts}</select>
    <button class="btn" id="resetT" style="background:rgba(255,255,255,.12);color:var(--ink)">Закрыть все окошки</button>`;
  $("asof").onchange=e=>{ASOF=e.target.value;ls.set("advent-asof",ASOF);today=-1;full={};render();load()};
  $("resetT").onclick=()=>{opened.clear();save();render();toast("Все окошки снова закрыты")};
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!TESTMODE&&!DEMO&&today>=0&&!$("modal").classList.contains("on"))load()});

/* миниатюры за дверцами подгружаются отдельно, небольшими порциями */
async function loadThumbs(only){
  if(DEMO)return;
  const need=(only||[...opened]).filter(d=>d<=today&&info[d]&&info[d].thumb===undefined);
  for(let i=0;i<need.length;i+=6){
    const part=need.slice(i,i+6);part.forEach(d=>info[d].thumb="");
    try{
      const r=await api({thumbs:part.join(",")});
      for(const [d,url] of Object.entries(r.thumbs||{})){
        if(!info[d])continue;info[d].thumb=url;
        const b=document.querySelector(`.door.open[data-d="${d}"] .behind`);if(b&&url)b.innerHTML=thumbHTML(+d);
      }
    }catch(e){}
  }
}
const thumbHTML=d=>info[d]&&info[d].thumb?`<img src="${info[d].thumb}" alt="">`:cat(scarfOf(d),d===31)+`<small>${d}</small>`;

function render(){
  const u=today;
  $("grid").innerHTML=ORDER.map(d=>{
    const st=u<0?"wait":d>u?"locked":(opened.has(d)?"open":"ready");
    return `<button class="door ${SIZE[d]||""} ${st} ${d===u?"today":""}" data-d="${d}" aria-label="${d} декабря, ${st==="open"?"открыто":st==="ready"?"можно открыть":"ещё закрыто"}">
      <div class="behind" style="background:linear-gradient(160deg,#fffaf2,${BG[d%5]})">${st==="open"?thumbHTML(d):""}</div>
      <div class="leaf t${d%5}"><span class="num">${d}</span></div></button>`}).join("");
  tick();
}

function tick(){
  if(today<0){$("timer").textContent="Зажигаем гирлянду…";return}
  const hms=s=>[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,"0")).join(":");
  let txt;
  if(today>=31)txt="Все окошки открыты. С Новым годом!";
  else if(today===0){const n=almaty();const days=Math.round((Date.UTC(2026,11,1)-Date.UTC(n.year,n.month-1,n.day))/864e5)-1;txt=`До первого окошка <b>${days>0?days+" дн ":""}${hms(nextIn)}</b>`}
  else txt=`Окошко №${today+1} откроется через <b>${hms(nextIn)}</b>`;
  $("timer").innerHTML=txt;
}
setInterval(()=>{if(today<0)return;nextIn--;if(nextIn<=0&&!preview){today=-1;load()}else tick()},1000);

let toastT;
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600)}

let cur=0,typeT;
async function show(d){
  cur=d;const it=info[d]||{},pic=$("mPic");
  pic.style.background=`linear-gradient(165deg,#e3ecfb,${BG[d%5]})`;
  pic.innerHTML=cat(scarfOf(d),d===31);
  $("mDate").textContent=`${d} декабря`;
  $("mTitle").textContent=it.title?`Котик ${it.title.charAt(0).toLowerCase()+it.title.slice(1)}`:"";
  const w=$("mWish"),wish=it.wish||"";clearInterval(typeT);
  if(reduce){w.textContent=wish}else{w.textContent="";let i=0;typeT=setInterval(()=>{w.textContent=wish.slice(0,++i);if(i>=wish.length)clearInterval(typeT)},45)}
  $("tune").textContent=it.music?"♪ Особая мелодия дня · сыграть ещё раз":`♪ ${TUNES[tuneOf(d)].t} · сыграть ещё раз`;
  $("prev").disabled=d<=1;$("next").disabled=d>=today;
  $("modal").classList.add("on");$("close").focus();
  if(d===31)confetti();
  if(!it.music)Music.play(d);
  if(DEMO)return;
  if(!(d in full)){
    pic.classList.add("loading");
    try{const r=await api({day:d});full[d]={img:r.img||"",audio:r.audio||""}}catch(e){full[d]={img:"",audio:""}}
    pic.classList.remove("loading");
  }
  if(cur!==d||!$("modal").classList.contains("on"))return;
  if(full[d].img)pic.innerHTML=`<img src="${full[d].img}" alt="Котик ${it.title||""}">`;
  if(it.music)Music.play(d,full[d].audio||null);
}
function openDoor(d,btn){
  if(today<0)return;
  if(d>today){btn.classList.remove("shake");void btn.offsetWidth;btn.classList.add("shake");
    toast(`Мур, ещё рано! Это окошко откроется ${d} декабря`);return}
  Music.unlock();const first=markOpen(d);if(first)Music.chime();
  if(first){btn.classList.add("open");btn.querySelector(".behind").innerHTML=thumbHTML(d);loadThumbs([d]);setTimeout(()=>show(d),reduce?0:750)}
  else show(d);
}
function close(){Music.stop();$("modal").classList.remove("on");clearInterval(typeT);render()}

$("grid").addEventListener("click",e=>{const b=e.target.closest(".door");if(b)openDoor(+b.dataset.d,b)});
$("close").onclick=close;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")close()});
$("prev").onclick=()=>{Music.unlock();markOpen(cur-1);show(cur-1)};
$("next").onclick=()=>{Music.unlock();markOpen(cur+1);show(cur+1)};
document.addEventListener("keydown",e=>{if(!$("modal").classList.contains("on"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft"&&!$("prev").disabled)$("prev").click();if(e.key==="ArrowRight"&&!$("next").disabled)$("next").click()});
$("moon").onclick=()=>toast("Лисичка машет тебе с луны");

/* музыка: шкатулка на Web Audio + своя музыка из таблицы */
const TUNES={
yolka:{t:"В лесу родилась ёлочка",bpm:120,tr:12,n:"C4:.5 A4:.5 A4:.5 G4:.5 A4:.5 F4:.5 C4:.5 C4:.5 C4:.5 A4:.5 A4:.5 Bb4:.5 G4:.5 C5:1.5 C5:.5 D4:.5 D4:.5 Bb4:.5 Bb4:.5 A4:.5 G4:.5 F4:.5 C4:.5 A4:.5 A4:.5 G4:.5 A4:.5 F4:1.5"},
jingle:{t:"Jingle Bells",bpm:190,tr:12,n:"E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4 F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 E4 D4 D4 E4 D4:2 G4:2 E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4 F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 G4 G4 F4 D4 C4:4"},
wish:{t:"We Wish You a Merry Christmas",bpm:170,tr:0,n:"G4 C5 C5:.5 D5:.5 C5:.5 B4:.5 A4 A4 A4 D5 D5:.5 E5:.5 D5:.5 C5:.5 B4 G4 G4 E5 E5:.5 F5:.5 E5:.5 D5:.5 C5 A4 G4:.5 G4:.5 A4 D5 B4 C5:3"},
silent:{t:"Тихая ночь",bpm:150,tr:0,n:"G4:1.5 A4:.5 G4 E4:3 G4:1.5 A4:.5 G4 E4:3 D5:2 D5 B4:3 C5:2 C5 G4:3 A4:2 A4 C5:1.5 B4:.5 A4 G4:1.5 A4:.5 G4 E4:3 A4:2 A4 C5:1.5 B4:.5 A4 G4:1.5 A4:.5 G4 E4:3 D5:2 D5 F5:1.5 D5:.5 B4 C5:3 E5:3 C5 G4 E4 G4:1.5 F4:.5 D4 C4:6"},
deck:{t:"Deck the Halls",bpm:150,tr:12,n:"G4:1.5 F4:.5 E4 D4 C4 D4 E4 C4 D4:.5 E4:.5 F4:.5 D4:.5 E4:1.5 D4:.5 C4 B3 C4:2 G4:1.5 F4:.5 E4 D4 C4 D4 E4 C4 D4:.5 E4:.5 F4:.5 D4:.5 E4:1.5 D4:.5 C4 B3 C4:2"},
twinkle:{t:"Мерцай, звёздочка",bpm:130,tr:12,n:"C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2"},
tannen:{t:"O Tannenbaum",bpm:100,tr:12,n:"D4 G4:.75 G4:.25 G4:1.5 A4:.5 B4:.75 B4:.25 B4:1.5 B4:.5 A4:.5 B4:.5 C5:1.5 F#4:.5 A4 G4:2"},
joy:{t:"Joy to the World",bpm:110,tr:12,n:"C4:1.5 B3:.5 A3:.75 G3:.25 F3:1.5 E3:.5 D3 C3:1.5 G3:.5 A3:1.5 A3:.5 B3:1.5 B3:.5 C4:3"},
carol:{t:"Щедрик",bpm:180,tr:0,n:"Bb4 A4:.5 Bb4:.5 G4 Bb4 A4:.5 Bb4:.5 G4 Bb4 A4:.5 Bb4:.5 G4 Bb4 A4:.5 Bb4:.5 G4 D5 C5:.5 D5:.5 Bb4 D5 C5:.5 D5:.5 Bb4 Bb4 A4:.5 Bb4:.5 G4 Bb4 A4:.5 Bb4:.5 G4:3"},
ode:{t:"Ода к радости",bpm:140,tr:12,n:"E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:.5 C4:2"},
noel:{t:"The First Noel",bpm:120,tr:12,n:"E4:.5 D4:.5 C4:1.5 D4:.5 E4:.5 F4:.5 G4:2 A4:.5 B4:.5 C5 B4 A4 G4:2 A4:.5 B4:.5 C5 B4 A4 G4 A4 B4 C5 G4 F4 E4:2"},
wences:{t:"Good King Wenceslas",bpm:130,tr:12,n:"G4 G4 G4 A4 G4 G4 D4:2 E4 D4 E4 F#4 G4:2 G4:2 G4 G4 G4 A4 G4 G4 D4:2 E4 D4 E4 F#4 G4:2 G4:2"},
godrest:{t:"God Rest Ye Merry Gentlemen",bpm:140,tr:12,n:"E4 E4 B4 B4 A4 G4 F#4 E4 D4 E4 F#4 G4 A4 B4:3 E4 E4 B4 B4 A4 G4 F#4 E4 D4 E4 F#4 G4 A4 B4:3"},
adeste:{t:"Adeste Fideles",bpm:120,tr:12,n:"G4 G4:2 D4 G4 A4:2 D4:2 B4 A4 B4 C5 B4:2 A4 G4:2"}
};
const TUNE_ORDER=["yolka","jingle","wish","silent","deck","twinkle","tannen","joy","carol","ode","noel","wences","godrest","adeste"];
const tuneOf=d=>d===31?"yolka":TUNE_ORDER[(d-1)%TUNE_ORDER.length];

const Music=(()=>{
  let ctx=null,master=null,verb=null,cur=null,last=null,on=true;
  try{on=localStorage.getItem("advent-sound")!=="off"}catch(e){}
  function init(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      ctx=new AC();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
      verb=ctx.createConvolver();const len=ctx.sampleRate*2.2|0,b=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){const x=b.getChannelData(c);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
      verb.buffer=b;const wet=ctx.createGain();wet.gain.value=.3;verb.connect(wet);wet.connect(master);
    }
    if(ctx.state==="suspended")ctx.resume();
    return ctx;
  }
  function bus(withVerb){const g=ctx.createGain();g.connect(master);if(withVerb)g.connect(verb);return g}
  function tone(out,f,t,len,vol){
    for(const [m,a,dec] of [[1,1,1],[2,.22,.5],[4.02,.05,.2]]){
      const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*m;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+len*dec);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+len*dec+.05);
    }
  }
  const freq=tok=>{const m=tok.match(/^([A-G])(#|b)?(\d)$/);return m?12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0):null};
  function stop(){
    if(!cur||!ctx)return;const c=cur;cur=null;
    try{c.g.gain.cancelScheduledValues(ctx.currentTime);c.g.gain.setTargetAtTime(0,ctx.currentTime,.12)}catch(e){}
    if(c.src)try{c.src.stop(ctx.currentTime+.6)}catch(e){}
    setTimeout(()=>{try{c.g.disconnect()}catch(e){}},1000);
  }
  function playTune(name){
    const T=TUNES[name],g=bus(true),beat=60/T.bpm;cur={g};let t=ctx.currentTime+.12;
    for(const tok of T.n.split(/\s+/)){
      const [p,len]=tok.split(":"),midi=freq(p);const d=(len?+len:1)*beat;
      if(midi!==null)tone(g,440*2**((midi+T.tr-69)/12),t,Math.max(1.4,d*1.6),.2);t+=d;
    }
  }
  async function playFile(url){
    const g=bus(false),me={g};cur=me;
    try{
      const bin=atob(url.slice(url.indexOf(",")+1)),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const buf=await ctx.decodeAudioData(u8.buffer);if(cur!==me)return;
      const s=ctx.createBufferSource();s.buffer=buf;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.9,ctx.currentTime+1.2);
      s.connect(g);s.start();me.src=s;
    }catch(e){}
  }
  function play(d,file){last=[d,file];stop();if(!on||!init())return;file?playFile(file):playTune(tuneOf(d))}
  function chime(){if(!on||!init())return;const g=bus(true);[1568,1976,2349,3136].forEach((f,i)=>tone(g,f,ctx.currentTime+i*.07,1.2,.08))}
  function toggle(){on=!on;try{localStorage.setItem("advent-sound",on?"on":"off")}catch(e){}if(!on)stop();return on}
  return{unlock:init,play,stop,chime,toggle,replay:()=>last&&play(...last),get on(){return on}};
})();

function soundButton(){
  const b=$("snd");
  b.innerHTML=`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/>${Music.on?"":'<path d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;
  b.setAttribute("aria-pressed",String(Music.on));b.setAttribute("aria-label",Music.on?"Выключить музыку":"Включить музыку");
}

$("snd").onclick=()=>{Music.unlock();const on=Music.toggle();soundButton();if(on&&$("modal").classList.contains("on"))Music.replay()};
$("tune").onclick=()=>{Music.unlock();if(!Music.on){Music.toggle();soundButton()}Music.replay()};
soundButton();

/* гирлянда */
const COLORS=["#ff5a5f","#ffd166","#5ad1a0","#6fa8ff","#ff9ff3"];
function garland(){
  const g=$("garland"),n=innerWidth<600?11:19,H=g.clientHeight,sag=H*.55;
  const y=t=>4+sag*Math.sin(Math.PI*((t*3)%1));
  let path="";for(let i=0;i<=120;i++){const t=i/120;path+=(i?"L":"M")+(t*1000).toFixed(1)+" "+y(t).toFixed(1)}
  g.innerHTML=`<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none"><path d="${path}" stroke="#3d4456" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>`+
  Array.from({length:n},(_,i)=>{const t=(i+.5)/n,c=COLORS[i%5];return `<span class="bulb" style="left:${t*100}%;top:${y(t)+3}px;background:${c};box-shadow:0 0 12px 3px ${c}88;animation-delay:${(i*.37)%2.4}s"></span>`}).join("");
}

/* снег */
const sc=$("snow"),sx=sc.getContext("2d");let flakes=[];
function size(c){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}
function initSnow(){size(sc);const k=innerWidth<600?60:130;flakes=Array.from({length:k},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:(Math.random()*2.4+.6)*devicePixelRatio,s:Math.random()*.6+.25,w:Math.random()*6.28}))}
function snow(){
  sx.clearRect(0,0,sc.width,sc.height);sx.fillStyle="rgba(255,255,255,.85)";
  for(const f of flakes){if(!reduce){f.y+=f.s*devicePixelRatio;f.w+=.01;f.x+=Math.sin(f.w)*.4*devicePixelRatio;if(f.y>sc.height){f.y=-5;f.x=Math.random()*sc.width}}
    sx.globalAlpha=.35+f.r/(4*devicePixelRatio);sx.beginPath();sx.arc(f.x,f.y,f.r,0,6.28);sx.fill()}
  sx.globalAlpha=1;if(!reduce)requestAnimationFrame(snow);
}

/* конфетти для 31 декабря */
const fc=$("fx"),fx=fc.getContext("2d");
function confetti(){
  if(reduce)return;size(fc);const W=fc.width,H=fc.height;
  const ps=Array.from({length:180},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*22,vy:-Math.random()*20-6,c:["#f0cf7a","#ff5a5f","#5ad1a0","#6fa8ff","#fff"][Math.random()*5|0],r:Math.random()*6.28,s:(Math.random()*6+4)*devicePixelRatio}));
  let t=0;(function step(){fx.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.55;p.vx*=.985;p.r+=.2;fx.save();fx.translate(p.x,p.y);fx.rotate(p.r);fx.fillStyle=p.c;fx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fx.restore()}
    if(++t<160)requestAnimationFrame(step);else fx.clearRect(0,0,W,H)})();
}

addEventListener("resize",()=>{initSnow();garland();if(reduce)snow()});
garland();initSnow();snow();render();load();
}
</script>
